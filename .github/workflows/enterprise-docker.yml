name: Enterprise Docker image

# Builds frps-enterprise (and the frpc CLI image) and pushes them to the GitHub
# Container Registry of this repository's owner:
#   ghcr.io/<owner>/frps-enterprise   ghcr.io/<owner>/frpc-enterprise
# Pushes to the default branch are tagged :edge, version tags vX.Y.Z as
# :X.Y.Z, :X.Y and :latest. Pull requests only build.
# Set the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets to also push to Docker Hub.

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    paths:
      - 'cmd/**'
      - 'client/**'
      - 'server/**'
      - 'pkg/**'
      - 'web/**'
      - 'dockerfiles/**'
      - 'deploy/docker/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/enterprise-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: enterprise-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frps-enterprise
            dockerfile: dockerfiles/Dockerfile-enterprise-frps
          - name: frpc-enterprise
            dockerfile: dockerfiles/Dockerfile-for-frpc
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          images="ghcr.io/${owner}/${{ matrix.name }}"
          if [ "${HAS_DOCKERHUB}" = "true" ]; then
            images="${images}"$'\n'"${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}"
          fi
          {
            echo "images<<EOF"
            echo "${images}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUSH == 'true' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
